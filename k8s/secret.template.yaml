# Database credentials.
# 1. cp k8s/secret.template.yaml k8s/secret.yaml   (secret.yaml is gitignored, never commit it)
# 2. replace CHANGE_ME with a real password
# 3. kubectl apply -f k8s/secret.yaml
# Postgres and the backend both read these values.
apiVersion: v1
kind: Secret
metadata:
  name: leoplaner-db
type: Opaque
stringData:            # plain text here, Kubernetes stores it base64-encoded
  POSTGRES_DB: leoplaner
  POSTGRES_USER: leoplaner
  POSTGRES_PASSWORD: CHANGE_ME
