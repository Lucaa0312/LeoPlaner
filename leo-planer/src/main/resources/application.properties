quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/demo
quarkus.datasource.jdbc.max-size=16
# prod (cloud): keep data across restarts; dev/test: start with an empty DB like before
quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.http.port=8080
# quarkus.package.type=fast-jar

# for unit tests
%test.quarkus.http.test-port=0

# Needed for fetching
quarkus.http.cors.enabled=true

# Change when we have a domain
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.http.cors.headers=Content-Type, Authorization

# Admin actions (reset all data, load demo data).
# Off in prod (cloud), on in dev. Override with LEOPLANER_RESET_ENABLED / LEOPLANER_DEMO_DATA_ENABLED.
leoplaner.reset-enabled=false
leoplaner.demo-data-enabled=false
%dev.leoplaner.reset-enabled=true
%dev.leoplaner.demo-data-enabled=true
%test.leoplaner.reset-enabled=true
%test.leoplaner.demo-data-enabled=true
