quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/demo
quarkus.datasource.jdbc.max-size=16
# prod (cloud): keep data across restarts; dev/test: start with an empty DB like before
quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.http.port=8080
# quarkus.package.type=fast-jar

# for unit tests
%test.quarkus.http.test-port=0

# Needed for fetching
quarkus.http.cors.enabled=true

# Change when we have a domain
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.http.cors.headers=Content-Type, Authorization

# Teacher wish extraction, any OpenAI compatible chat completions API.
# Without base-url and model, src/files/teacherWishProfiles.json stands in.
# Mistral: https://api.mistral.ai/v1, Ollama: http://localhost:11434/v1
# Ollama needs a model with a larger context than its default, see ollama/wish-model.Modelfile.
# leoplaner.wishes.base-url=http://localhost:11434/v1
# leoplaner.wishes.model=qwen3-wish
# leoplaner.wishes.api-key=
# Sent as reasoning_effort on the retry after a failed answer; "none" turns thinking off on Ollama.
# leoplaner.wishes.retry-reasoning-effort=none
leoplaner.wishes.max-tokens=4096
# false falls back to response_format json_object for servers without json_schema
leoplaner.wishes.structured-output=true

# Admin actions (reset all data, load demo data).
# Off in prod (cloud), on in dev. Override with LEOPLANER_RESET_ENABLED / LEOPLANER_DEMO_DATA_ENABLED.
leoplaner.reset-enabled=false
leoplaner.demo-data-enabled=false
%dev.leoplaner.reset-enabled=true
%dev.leoplaner.demo-data-enabled=true
%test.leoplaner.reset-enabled=true
%test.leoplaner.demo-data-enabled=true
