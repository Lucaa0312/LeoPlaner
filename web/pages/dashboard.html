<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Dashboard · LeoPlaner</title>
        <script>
            // Apply the stored theme + sidebar state before first paint.
            (function () {
                try {
                    var r = document.documentElement;
                    var t = localStorage.getItem("leo.theme");
                    if (t === "dark" || t === "light") r.dataset.theme = t;
                    if (localStorage.getItem("leo.sidebar") === "collapsed")
                        r.dataset.sidebar = "collapsed";
                } catch (e) {}
            })();
        </script>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='8' y='6' width='5.5' height='20' rx='2.75' fill='%23fff'/%3E%3Crect x='8' y='20.5' width='16' height='5.5' rx='2.75' fill='%23fff'/%3E%3Ccircle cx='22.5' cy='10.5' r='3.25' fill='%23fbbf24'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css"
        />
        <link rel="stylesheet" href="../style/tokens.css" />
        <link rel="stylesheet" href="../style/base.css" />
        <link rel="stylesheet" href="../style/components.css" />
        <link rel="stylesheet" href="../style/shell.css" />
        <link rel="stylesheet" href="../style/dashboard.css" />
        <script type="module" src="../dist/js/pages/dashboard.js"></script>
    </head>

    <body class="app">
        <nav id="nav-bar" class="sidebar"></nav>

        <main id="main-content" class="main">
            <div class="page" id="dashboard">
                <header class="page-header" id="dashboard-header">
                    <button
                        type="button"
                        class="icon-btn page-header__menu"
                        data-drawer-toggle
                        aria-label="Menü öffnen"
                    >
                        <i class="ti ti-menu-2" aria-hidden="true"></i>
                    </button>
                    <div class="page-header__text">
                        <p class="page-header__eyebrow">Übersicht</p>
                        <h1 class="page-header__title" id="dashboard-title">
                            Dashboard
                        </h1>
                        <p class="page-header__subtitle" id="dashboard-subtitle">
                            Der aktuelle Stand Ihrer Schuldaten – und was der
                            Stundenplanung noch fehlt.
                        </p>
                    </div>
                    <div
                        class="page-header__actions"
                        id="dashboard-actions"
                    ></div>
                </header>

                <!-- Shown when the backend is unreachable or has no data yet. -->
                <div id="dashboard-notice" hidden></div>

                <section
                    id="stats-grid"
                    class="stats-grid"
                    aria-label="Kennzahlen"
                ></section>

                <div class="dashboard-columns">
                    <section
                        id="readiness-panel"
                        class="panel card"
                        aria-label="Planungsbereitschaft"
                    ></section>
                    <section
                        id="planning-panel"
                        class="panel card"
                        aria-label="Stundenplanung"
                    ></section>
                </div>

                <div class="dashboard-columns">
                    <section
                        id="class-hours-panel"
                        class="panel card"
                        aria-label="Wochenstunden je Klasse"
                    ></section>
                    <section
                        id="teacher-load-panel"
                        class="panel card"
                        aria-label="Lehrerauslastung"
                    ></section>
                </div>

                <section
                    id="room-demand-panel"
                    class="panel card"
                    aria-label="Räume und Raumbedarf"
                ></section>
            </div>
        </main>
    </body>
</html>
