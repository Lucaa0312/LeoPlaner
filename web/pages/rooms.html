<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Räume · LeoPlaner</title>
        <script>
            // Apply the stored theme + sidebar state before first paint.
            (function () {
                try {
                    var r = document.documentElement;
                    var t = localStorage.getItem("leo.theme");
                    if (t === "dark" || t === "light") r.dataset.theme = t;
                    if (localStorage.getItem("leo.sidebar") === "collapsed")
                        r.dataset.sidebar = "collapsed";
                } catch (e) {}
            })();
        </script>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='8' y='6' width='5.5' height='20' rx='2.75' fill='%23fff'/%3E%3Crect x='8' y='20.5' width='16' height='5.5' rx='2.75' fill='%23fff'/%3E%3Ccircle cx='22.5' cy='10.5' r='3.25' fill='%23fbbf24'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css"
        />
        <link rel="stylesheet" href="../style/tokens.css" />
        <link rel="stylesheet" href="../style/base.css" />
        <link rel="stylesheet" href="../style/components.css" />
        <link rel="stylesheet" href="../style/shell.css" />
        <link rel="stylesheet" href="../style/rooms.css" />
        <script type="module" src="../dist/js/pages/rooms.js"></script>
    </head>

    <body class="app">
        <nav id="nav-bar" class="sidebar"></nav>

        <main id="main-content" class="main">
            <div class="page">
                <header class="page-header" id="room-header">
                    <button
                        type="button"
                        class="icon-btn page-header__menu"
                        data-drawer-toggle
                        aria-label="Menü öffnen"
                    >
                        <i class="ti ti-menu-2" aria-hidden="true"></i>
                    </button>
                    <div class="page-header__text" id="header-section">
                        <p class="page-header__eyebrow">Verwaltung</p>
                        <h1 class="page-header__title" id="header-text">Räume</h1>
                        <p class="page-header__subtitle" id="header-subtext">
                            Verwalten Sie Ihre R&auml;ume, deren K&uuml;rzel und
                            Ausstattung (Raumtypen).
                        </p>
                    </div>
                    <div class="page-header__actions" id="controls">
                        <label class="search-field" id="search-bar">
                            <i class="ti ti-search" aria-hidden="true"></i>
                            <input
                                type="search"
                                class="input"
                                id="input-field"
                                placeholder="Nach Räumen suchen"
                                aria-label="Nach Räumen suchen"
                                autocomplete="off"
                            />
                        </label>
                        <button type="button" class="btn btn--primary" id="add-btn">
                            <i class="ti ti-plus" aria-hidden="true"></i>
                            <span>Raum hinzufügen</span>
                        </button>
                    </div>
                </header>

                <section class="data-view" id="display-rooms">
                    <!-- Generated in JavaScript -->
                </section>

                <div id="no-rooms" hidden></div>
                <div id="no-results" hidden></div>

                <div class="modal" id="add-room-screen" role="dialog" aria-modal="true">
                    <!-- Generated in JavaScript -->
                </div>
            </div>
        </main>
    </body>
</html>
